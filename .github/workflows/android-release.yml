name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Generate release notes from commits
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### 变更内容" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log --pretty=format "- %s" "$PREV_TAG..$TAG" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          else
            echo "### 首次发布" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log --pretty=format "- %s" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "**构建产物：** iQOO 充电监测 Android APK（release 签名版）" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
